[build.environment]
  # Firebase web config values are public by design: Next.js inlines every
  # NEXT_PUBLIC_* variable into the client bundle. Exclude them from secrets
  # scanning so they don't fail the build. Real secrets (e.g. UNSPLASH_ACCESS_KEY,
  # PEXELS_API_KEY) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"
